name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Lint + typecheck + tests (including robustness and privacy) + build
      - run: npm run check

      # A real export contains personal data: never in the repo, never in the deployed site.
      - name: No personal export in the repository or in the build
        run: |
          if git ls-files | grep -iE '\.(csv|zip)$'; then
            echo "::error::CSV/zip files must not be committed"; exit 1
          fi
          if find dist -iname '*.csv' -o -iname '*.zip' | grep .; then
            echo "::error::dist/ must not contain CSV/zip files"; exit 1
          fi

      # Fetched by deploy.yml (workflow_run): only on main, so we never deploy a PR build.
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: dist
          path: dist
          retention-days: 1
